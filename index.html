<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>MigrationMap — Free Website Migration & Redirect Mapping Tool</title>
    <meta name="description" content="Map legacy URLs, detect redirect loops, and export verified rules for Next.js, Vercel, Netlify, Apache, and Nginx. Deterministic matching running locally in your browser." />
    <link rel="canonical" href="https://migrationmap.dev" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://migrationmap.dev" />
    <meta property="og:title" content="MigrationMap — Free Website Migration & Redirect Mapping Tool" />
    <meta property="og:description" content="Map legacy URLs, detect redirect loops, and export verified rules for Next.js, Vercel, Netlify, Apache, and Nginx. Deterministic matching running locally in your browser." />
    <meta property="og:site_name" content="MigrationMap" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MigrationMap — Free Website Migration & Redirect Mapping Tool" />
    <meta name="twitter:description" content="Map legacy URLs, detect redirect loops, and export verified rules for Next.js, Vercel, Netlify, Apache, and Nginx. Deterministic matching running locally in your browser." />
    
    <!-- Theme & Monochrome Favicon -->
    <meta name="theme-color" content="#171717" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23171717'/><path d='M9 12h9a3 3 0 0 1 3 3v0a3 3 0 0 1-3 3h-8' stroke='%23ffffff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' fill='none'/><path d='M13 15l-3 3 3 3' stroke='%23ffffff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' fill='none'/><path d='M18 9l3 3-3 3' stroke='%23a3a3a3' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>" />
    
    <!-- Fonts: Poppins & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Theme initialization -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('migrationmap-theme');
          var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="h-full bg-neutral-50 text-neutral-900 dark:bg-neutral-950 dark:text-neutral-100 antialiased selection:bg-neutral-900 selection:text-white dark:selection:bg-white dark:selection:text-neutral-900 transition-colors duration-150">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
